name: publish to pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
    - name: Build package
      run: uv build
    - name: Publish package
      run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}
