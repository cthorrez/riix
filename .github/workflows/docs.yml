name: build docs

# build the documentation whenever there are new commits on main
on:
  push:
    branches:
      - main

# security: restrict permissions for CI jobs.
permissions:
  contents: read

# cancel superseded runs so only the latest push deploys
concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  # Build the documentation and upload the static HTML files as an artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync
      - run: uv run pdoc -o _site -t docs --docformat google --logo https://cthorrez.github.io/riix/riix_logo.png --favicon https://cthorrez.github.io/riix/favicon.ico riix
      # the logo and favicon are referenced by URL from the deployed site itself
      - run: cp docs/riix_logo.png docs/favicon.ico _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  # Deploy the artifact to GitHub pages.
  # This is a separate job so that only actions/deploy-pages has the necessary permissions.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
