[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "riix"
version = "0.1.0"
description = "vectorized implementations of online rating systems"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name="Clayton Thorrez", email="claytonthorrez@gmail.com"},
]
# jax (a core dependency since 0.1.0) requires >=3.11
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "polars",
    "jax",
]
keywords = ["rating system", "paired comparison"]

[project.optional-dependencies]
optuna = ["optuna"]

[project.urls]
Docs = "https://cthorrez.github.io/riix/"
Repository = "https://github.com/cthorrez/riix"
Issues = "https://github.com/cthorrez/riix/issues"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pdoc",
    "pre-commit",
    "optuna",
]

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
